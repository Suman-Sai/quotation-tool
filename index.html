<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chandini Interiors Quotation</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-banner">
      <img src=".\Interior_logo.jpg" alt="Company Logo" class="company-logo">
      <h1>Chandini Interiors</h1>
      <p>Designs for Tomorrow</p>
    </div>
    <h2>Quotation</h2>
  </header>

  <!-- Top Fields -->
  <div class="top-fields">
    <label>Date: <input type="date" id="quotationDate"></label>
    <label>To (Address): <input type="text" id="toAddress"></label>
    <label>Place of Service / Customer Address: <input type="text" id="serviceAddress"></label>
  </div>

  <!-- Quotation Table -->
  <table id="quotationTable">
    <thead>
      <tr>
        <th>Item</th>
        <th>Sq.ft / Qty</th>
        <th>Price per unit</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="text" class="item"></td>
        <td><input type="text" class="qty" placeholder="Qty (e.g. 258 ft)"></td>
        <td><input type="number" class="price" value="0"></td>
        <td><input type="text" class="total" placeholder="Enter total"></td>
        <td><button class="removeBtn" onclick="removeRow(this)">Remove</button></td>
      </tr>
    </tbody>
  </table>

  <button class="btn" onclick="addRow()">Add Row</button>

  <!-- Summary -->
  <div class="totals-box">
  <div class="summary">
    <p><strong>Subtotal:</strong> ₹<span id="subtotal">0.00</span></p>
    <p><strong>GST (18%):</strong> ₹<span id="gstAmount">0.00</span></p>
  </div>
  <div class="grand-total">
    <strong>Grand Total:</strong> ₹<span id="grandTotal">0.00</span>
  </div>
  <p class="amount-words"><strong>Amount in Words:</strong> <span id="amountWords">Zero Rupees Only</span></p>
</div>


  <!-- Footer -->
  <div class="footer">
    <label><strong>Company GSTIN:</strong>
       29CFXPB2910Q1ZR ( Karnataka )
    </label><br>
    <label><strong>Company Address:</strong><br>
             Chandini Interiors, No 30/A, Near Ayyappaswami Temple, Lalji Nagar, 4th Cross Road, Lakkasandra, Bengaluru, Bengaluru Urban, Karnataka - 560030.
    </label>
  </div>

  <!-- Print Button -->
  <div class="print-section">
    <button class="btn" onclick="printQuotation()">🖨️ Print Quotation</button>
  </div>
  <script src="./script.js"></script>
</body>
</html>
