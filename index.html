  <script>
 // Add new row
function addRow() {
  const table = document.getElementById("quotationTable").getElementsByTagName("tbody")[0];
  const newRow = table.insertRow();
  newRow.innerHTML = `
    <td><input type="text" class="item"></td>
    <td><input type="number" class="qty" value="0"></td>
    <td><input type="number" class="price" value="0"></td>
    <td class="total">0</td>
    <td><button class="btn" onclick="removeRow(this)">Remove</button></td>
  `;
}

// Remove row
function removeRow(btn) {
  const row = btn.closest("tr");
  row.remove();
  updateTotals();
}

// Update totals dynamically
document.addEventListener("input", function(e) {
  if (e.target.classList.contains("qty") || e.target.classList.contains("price")) {
    const row = e.target.closest("tr");
    const qty = parseFloat(row.querySelector(".qty").value) || 0;
    const price = parseFloat(row.querySelector(".price").value) || 0;
    const total = qty * price;
    row.querySelector(".total").textContent = total.toFixed(2);
    updateTotals();
  }
});

// Calculate subtotal, GST, and grand total
function updateTotals() {
  let subTotal = 0;
  document.querySelectorAll(".total").forEach(cell => {
    subTotal += parseFloat(cell.textContent) || 0;
  });

  const gst = subTotal * 0.18;
  const grandTotal = subTotal + gst;

  document.getElementById("subTotal").textContent = subTotal.toFixed(2);
  document.getElementById("gstAmount").textContent = gst.toFixed(2);
  document.getElementById("grandTotal").textContent = grandTotal.toFixed(2);
  document.getElementById("amountWords").textContent = numberToWords(Math.round(grandTotal)) + " Rupees Only";
}

// Convert number to words (Indian numbering system)
function numberToWords(num) {
  const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen",
                "Seventeen", "Eighteen", "Nineteen"];
  const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

  if (num === 0) return "Zero";

  function convert(n) {
    if (n < 20) return ones[n];
    if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? " " + ones[n % 10] : "");
    if (n < 1000) return ones[Math.floor(n / 100)] + " Hundred" + (n % 100 ? " and " + convert(n % 100) : "");
    if (n < 100000) return convert(Math.floor(n / 1000)) + " Thousand" + (n % 1000 ? " " + convert(n % 1000) : "");
    if (n < 10000000) return convert(Math.floor(n / 100000)) + " Lakh" + (n % 100000 ? " " + convert(n % 100000) : "");
    return convert(Math.floor(n / 10000000)) + " Crore" + (n % 10000000 ? " " + convert(n % 10000000) : "");
  }

  return convert(num);
}

// Print quotation cleanly
function printQuotation() {
  document.querySelectorAll(".btn").forEach(btn => btn.style.display = "none");
  window.print();
  document.querySelectorAll(".btn").forEach(btn => btn.style.display = "inline-block");
}
  </script>
